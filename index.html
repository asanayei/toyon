<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toyon</title>
<meta name="description" content="Classical computer vision, live in your browser. Nothing is uploaded.">
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --text: #e8eaf0; --muted: #9aa3b2;
    --accent: #4f9cff; --line: #2a2f3a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --text: #15181e; --muted: #5b6474; --accent: #1a6ae0; --line: #dde1e8; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 26px; margin: 8px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; }

  .stage {
    position: relative; width: 100%; background: #000; border-radius: 12px;
    overflow: hidden; touch-action: none; user-select: none;
  }
  .stage canvas { display: block; width: 100%; height: auto; }
  #fx { position: absolute; inset: 0; }
  .divider {
    position: absolute; top: 0; bottom: 0; width: 3px; background: #fff;
    box-shadow: 0 0 6px rgba(0,0,0,.6); transform: translateX(-1px); cursor: ew-resize;
  }
  .divider::after {
    content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: #fff; color: #000; border-radius: 50%; width: 34px; height: 34px;
    display: grid; place-items: center; font-size: 18px;
  }
  .tag {
    position: absolute; top: 10px; padding: 3px 9px; border-radius: 6px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 14px;
  }
  .tag.l { left: 10px; } .tag.r { right: 10px; }
  #fps { position: absolute; bottom: 10px; right: 10px; }

  .effects { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 12px; }
  button, label.btn {
    font: inherit; padding: 9px 15px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .slider { display: flex; align-items: center; gap: 10px; flex: 1 1 260px; }
  .slider input { flex: 1; accent-color: var(--accent); }
  .slider span { min-width: 88px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 15px; margin-top: 14px; }
  input[type=file] { display: none; }
  .credit { font-size: 13px; } .credit a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Toyon</h1>
  <p class="sub">Classical computer vision, live in your browser. Nothing is uploaded.</p>

  <div class="stage" id="stage">
    <canvas id="src"></canvas>
    <canvas id="fx"></canvas>
    <div class="divider" id="divider"></div>
    <div class="tag l">Original</div>
    <div class="tag r" id="fxname">Edges</div>
    <div class="tag" id="fps"></div>
  </div>

  <div class="effects" id="effects"></div>

  <div class="row">
    <div class="slider"><span id="knobname">Strength</span><input id="knob" type="range" min="0" max="100" value="50"></div>
    <label class="btn">📁 Your image<input id="file" type="file" accept="image/*"></label>
    <button id="cam">📷 Webcam</button>
  </div>

  <p class="hint">Drag the white line to compare. Drop an image anywhere.</p>
  <p class="hint credit">Toyon photo: <a href="https://commons.wikimedia.org/wiki/File:J20151125-0008%E2%80%94Heteromeles_arbutifolia_(23303059776).jpg">John Rusk</a>, <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a></p>
</main>

<script>
// ---------- effects: each has a label, a slider name, and a run(src, out, w, h, t) ----------
// src/out are RGBA Uint8ClampedArrays; t is the slider value in 0..1.
const EFFECTS = {
  edges:   { label: 'Edges',    knob: 'Contrast',  run: edgesFx },
  canny:   { label: 'Canny',    knob: 'Threshold', run: cannyFx },
  corners: { label: 'Corners',  knob: 'Amount',    run: cornersFx },
  cartoon: { label: 'Cartoon',  knob: 'Colors',    run: cartoonFx },
  thermal: { label: 'Thermal',  knob: 'Gamma',     run: thermalFx },
  thresh:  { label: 'Threshold',knob: 'Level',     run: threshFx },
  pixel:   { label: 'Pixelate', knob: 'Block',     run: pixelFx },
  emboss:  { label: 'Emboss',   knob: 'Depth',     run: embossFx },
  blur:    { label: 'Blur',     knob: 'Radius',    run: blurFx },
  skeleton:{ label: 'Skeleton', knob: 'Threshold', run: skeletonFx },
};

function toGray(src, w, h) {
  const g = new Float32Array(w * h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4)
    g[i] = 0.299 * src[j] + 0.587 * src[j + 1] + 0.114 * src[j + 2];
  return g;
}

// Separable Gaussian blur on a single channel.
function gauss(a, w, h, sigma) {
  if (sigma < 0.3) return a.slice();
  const r = Math.ceil(sigma * 2.5), k = new Float32Array(2 * r + 1);
  let s = 0;
  for (let i = -r; i <= r; i++) s += k[i + r] = Math.exp(-(i * i) / (2 * sigma * sigma));
  for (let i = 0; i < k.length; i++) k[i] /= s;
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      let v = 0;
      for (let i = -r; i <= r; i++) {
        const xx = x + i < 0 ? 0 : x + i >= w ? w - 1 : x + i;
        v += a[row + xx] * k[i + r];
      }
      tmp[row + x] = v;
    }
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let v = 0;
      for (let i = -r; i <= r; i++) {
        const yy = y + i < 0 ? 0 : y + i >= h ? h - 1 : y + i;
        v += tmp[yy * w + x] * k[i + r];
      }
      out[y * w + x] = v;
    }
  }
  return out;
}

function sobel(g, w, h) {
  const gx = new Float32Array(w * h), gy = new Float32Array(w * h);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const a = g[i - w - 1], b = g[i - w], c = g[i - w + 1];
      const d = g[i - 1],                 f = g[i + 1];
      const p = g[i + w - 1], q = g[i + w], r = g[i + w + 1];
      gx[i] = (c + 2 * f + r) - (a + 2 * d + p);
      gy[i] = (p + 2 * q + r) - (a + 2 * b + c);
    }
  }
  return { gx, gy };
}

function writeGray(out, v, n) {
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    out[j] = out[j + 1] = out[j + 2] = v[i]; out[j + 3] = 255;
  }
}

function edgesFx(src, out, w, h, t) {
  const { gx, gy } = sobel(gauss(toGray(src, w, h), w, h, 1), w, h);
  const gain = 0.5 + t * 4, m = new Float32Array(w * h);
  for (let i = 0; i < m.length; i++) m[i] = Math.hypot(gx[i], gy[i]) * gain * 0.25;
  writeGray(out, m, m.length);
}

function cannyFx(src, out, w, h, t) {
  const n = w * h;
  const { gx, gy } = sobel(gauss(toGray(src, w, h), w, h, 1.4), w, h);
  const mag = new Float32Array(n);
  for (let i = 0; i < n; i++) mag[i] = Math.hypot(gx[i], gy[i]);
  // Non-maximum suppression along the gradient direction (4 bins).
  const nms = new Float32Array(n);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x, m = mag[i];
      if (!m) continue;
      let ang = Math.atan2(gy[i], gx[i]) * 180 / Math.PI;
      if (ang < 0) ang += 180;
      let a, b;
      if (ang < 22.5 || ang >= 157.5) { a = mag[i - 1]; b = mag[i + 1]; }
      else if (ang < 67.5)            { a = mag[i - w + 1]; b = mag[i + w - 1]; }
      else if (ang < 112.5)           { a = mag[i - w]; b = mag[i + w]; }
      else                            { a = mag[i - w - 1]; b = mag[i + w + 1]; }
      if (m >= a && m >= b) nms[i] = m;
    }
  }
  // Double threshold + hysteresis.
  const hi = 20 + t * 300, lo = hi * 0.4;
  const edge = new Uint8Array(n), stack = [];
  for (let i = 0; i < n; i++) if (nms[i] >= hi) { edge[i] = 1; stack.push(i); }
  while (stack.length) {
    const i = stack.pop();
    for (const d of [-w - 1, -w, -w + 1, -1, 1, w - 1, w, w + 1]) {
      const j = i + d;
      if (j >= 0 && j < n && !edge[j] && nms[j] >= lo) { edge[j] = 1; stack.push(j); }
    }
  }
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    const v = edge[i] ? 255 : 0;
    out[j] = out[j + 1] = out[j + 2] = v; out[j + 3] = 255;
  }
}

// Harris corners: draws dots on a dimmed copy of the image. Returns the dot list for the overlay.
function cornersFx(src, out, w, h, t) {
  const n = w * h, g = gauss(toGray(src, w, h), w, h, 1);
  const { gx, gy } = sobel(g, w, h);
  const xx = new Float32Array(n), yy = new Float32Array(n), xy = new Float32Array(n);
  for (let i = 0; i < n; i++) { xx[i] = gx[i] * gx[i]; yy[i] = gy[i] * gy[i]; xy[i] = gx[i] * gy[i]; }
  const sxx = gauss(xx, w, h, 2), syy = gauss(yy, w, h, 2), sxy = gauss(xy, w, h, 2);
  const R = new Float32Array(n);
  let max = 0;
  for (let i = 0; i < n; i++) {
    const det = sxx[i] * syy[i] - sxy[i] * sxy[i], tr = sxx[i] + syy[i];
    R[i] = det - 0.05 * tr * tr;
    if (R[i] > max) max = R[i];
  }
  const thr = max * (0.2 - t * 0.199), pts = [], rad = 4;
  for (let y = rad; y < h - rad; y++) {
    for (let x = rad; x < w - rad; x++) {
      const v = R[y * w + x];
      if (v < thr) continue;
      let best = true;
      for (let dy = -rad; dy <= rad && best; dy++)
        for (let dx = -rad; dx <= rad; dx++)
          if (R[(y + dy) * w + x + dx] > v) { best = false; break; }
      if (best) pts.push([x, y]);
    }
  }
  for (let j = 0; j < src.length; j += 4) {
    out[j] = src[j] * 0.45; out[j + 1] = src[j + 1] * 0.45; out[j + 2] = src[j + 2] * 0.45; out[j + 3] = 255;
  }
  return pts;
}

function cartoonFx(src, out, w, h, t) {
  const n = w * h, levels = Math.round(2 + t * 8), step = 255 / (levels - 1);
  const r = new Float32Array(n), g = new Float32Array(n), b = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4) { r[i] = src[j]; g[i] = src[j + 1]; b[i] = src[j + 2]; }
  const rb = gauss(r, w, h, 2), gb = gauss(g, w, h, 2), bb = gauss(b, w, h, 2);
  const { gx, gy } = sobel(gauss(toGray(src, w, h), w, h, 1.2), w, h);
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    const ink = Math.hypot(gx[i], gy[i]) > 90 ? 0 : 1;
    out[j]     = Math.round(rb[i] / step) * step * ink;
    out[j + 1] = Math.round(gb[i] / step) * step * ink;
    out[j + 2] = Math.round(bb[i] / step) * step * ink;
    out[j + 3] = 255;
  }
}

// Turbo colormap, polynomial approximation.
function turbo(x) {
  const r = 0.13572138 + x * (4.61539260 + x * (-42.66032258 + x * (132.13108234 + x * (-152.94239396 + x * 59.28637943))));
  const g = 0.09140261 + x * (2.19418839 + x * (4.84296658 + x * (-14.18503333 + x * (4.27729857 + x * 2.82956604))));
  const b = 0.10667330 + x * (12.64194608 + x * (-60.58204836 + x * (110.36276771 + x * (-89.90310912 + x * 27.34824973))));
  return [r * 255, g * 255, b * 255];
}
const TURBO = Array.from({ length: 256 }, (_, i) => turbo(i / 255));

function thermalFx(src, out, w, h, t) {
  const gamma = 0.3 + t * 2.4, g = toGray(src, w, h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) {
    const c = TURBO[Math.round(255 * Math.pow(g[i] / 255, gamma))];
    out[j] = c[0]; out[j + 1] = c[1]; out[j + 2] = c[2]; out[j + 3] = 255;
  }
}

function threshFx(src, out, w, h, t) {
  const level = t * 255, g = toGray(src, w, h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) {
    const v = g[i] > level ? 255 : 0;
    out[j] = out[j + 1] = out[j + 2] = v; out[j + 3] = 255;
  }
}

function pixelFx(src, out, w, h, t) {
  const B = Math.max(2, Math.round(2 + t * 38));
  for (let by = 0; by < h; by += B) {
    for (let bx = 0; bx < w; bx += B) {
      let r = 0, g = 0, b = 0, c = 0;
      for (let y = by; y < Math.min(by + B, h); y++)
        for (let x = bx; x < Math.min(bx + B, w); x++) {
          const j = (y * w + x) * 4; r += src[j]; g += src[j + 1]; b += src[j + 2]; c++;
        }
      r /= c; g /= c; b /= c;
      for (let y = by; y < Math.min(by + B, h); y++)
        for (let x = bx; x < Math.min(bx + B, w); x++) {
          const j = (y * w + x) * 4; out[j] = r; out[j + 1] = g; out[j + 2] = b; out[j + 3] = 255;
        }
    }
  }
}

function embossFx(src, out, w, h, t) {
  const g = toGray(src, w, h), k = 0.5 + t * 4, v = new Float32Array(w * h).fill(128);
  for (let y = 1; y < h - 1; y++)
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      v[i] = 128 + k * (g[i + w + 1] - g[i - w - 1]);
    }
  writeGray(out, v, v.length);
}

function blurFx(src, out, w, h, t) {
  const n = w * h, s = 0.5 + t * 12;
  const ch = [0, 1, 2].map(c => {
    const a = new Float32Array(n);
    for (let i = 0; i < n; i++) a[i] = src[i * 4 + c];
    return gauss(a, w, h, s);
  });
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    out[j] = ch[0][i]; out[j + 1] = ch[1][i]; out[j + 2] = ch[2][i]; out[j + 3] = 255;
  }
}

// ---------- skeleton: binarize -> Euclidean distance map -> iterative thinning ----------
// Exact squared Euclidean distance transform (Felzenszwalb & Huttenlocher), 1D pass.
function dt1d(f, n, d, v, z) {
  let k = 0; v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
  for (let q = 1; q < n; q++) {
    let s;
    while (true) {
      s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      if (s <= z[k]) k--; else break;
    }
    k++; v[k] = q; z[k] = s; z[k + 1] = Infinity;
  }
  k = 0;
  for (let q = 0; q < n; q++) {
    while (z[k + 1] < q) k++;
    d[q] = (q - v[k]) * (q - v[k]) + f[v[k]];
  }
}

// Distance from each foreground pixel to the nearest background pixel.
function edt(bin, w, h) {
  const INF = 1e12, n = Math.max(w, h), out = new Float32Array(w * h);
  const f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let i = 0; i < w * h; i++) out[i] = bin[i] ? INF : 0;
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) f[y] = out[y * w + x];
    dt1d(f, h, d, v, z);
    for (let y = 0; y < h; y++) out[y * w + x] = d[y];
  }
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) f[x] = out[y * w + x];
    dt1d(f, w, d, v, z);
    for (let x = 0; x < w; x++) out[y * w + x] = Math.sqrt(d[x]);
  }
  return out;
}

// One Zhang-Suen thinning sub-iteration. Returns how many pixels were removed.
function thinPass(img, w, h, pass) {
  const del = [];
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      if (!img[i]) continue;
      const p2 = img[i - w], p3 = img[i - w + 1], p4 = img[i + 1], p5 = img[i + w + 1];
      const p6 = img[i + w], p7 = img[i + w - 1], p8 = img[i - 1], p9 = img[i - w - 1];
      const B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
      if (B < 2 || B > 6) continue;
      const A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) +
                (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2);
      if (A !== 1) continue;
      if (pass === 0 ? (p2 * p4 * p6 || p4 * p6 * p8) : (p2 * p4 * p8 || p2 * p6 * p8)) continue;
      del.push(i);
    }
  }
  for (const i of del) img[i] = 0;
  return del.length;
}

let skel = { key: null };
function skeletonFx(src, out, w, h, t, info) {
  const n = w * h, key = `${info.frame}|${t}|${w}x${h}`;
  if (skel.key !== key) {
    // Binarize on redness (R minus the larger of G, B): picks out berries, lips, red objects.
    const red = new Float32Array(n);
    for (let i = 0, j = 0; i < n; i++, j += 4) red[i] = Math.max(0, src[j] - Math.max(src[j + 1], src[j + 2]));
    const g = gauss(red, w, h, 1.5), level = 5 + t * 170;
    const bin = new Uint8Array(n);
    for (let y = 1; y < h - 1; y++)
      for (let x = 1; x < w - 1; x++) bin[y * w + x] = g[y * w + x] > level ? 1 : 0;
    const dist = edt(bin, w, h);
    let max = 1;
    for (let i = 0; i < n; i++) if (dist[i] > max) max = dist[i];
    skel = { key, bin, dist, max, cur: bin.slice(), step: 0, done: false };
  }
  // Images animate one thinning step per frame; live video jumps straight to the result.
  const S = skel, now = performance.now();
  const steps = info.live ? 1e9 : now - (S.last || 0) > 120 ? 1 : 0;
  if (steps) S.last = now;
  for (let k = 0; !S.done && k < steps; k++) {
    const removed = thinPass(S.cur, w, h, 0) + thinPass(S.cur, w, h, 1);
    if (removed) S.step++; else S.done = true;
  }
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    let r = 0, g = 0, b = 0;
    if (S.bin[i]) {
      const c = TURBO[Math.min(255, Math.round(255 * S.dist[i] / S.max))];
      const k = S.cur[i] && !S.done ? 1 : 0.35;
      r = c[0] * k; g = c[1] * k; b = c[2] * k;
    }
    out[j] = r; out[j + 1] = g; out[j + 2] = b; out[j + 3] = 255;
  }
  if (S.done) {
    // Draw the skeleton 2px wide so it shows at screen size.
    for (let i = w; i < n - w; i++) {
      if (!S.cur[i]) continue;
      for (const q of [i, i + 1, i + w, i + w + 1]) {
        const j = q * 4; out[j] = out[j + 1] = out[j + 2] = 255;
      }
    }
  }
  return { more: !S.done, label: S.done ? `Skeleton · ${S.step} steps` : `Thinning · step ${S.step}` };
}

// ---------- app ----------
const MAX_W = 720;
const srcCv = document.getElementById('src'), fxCv = document.getElementById('fx');
const sctx = srcCv.getContext('2d', { willReadFrequently: true }), fctx = fxCv.getContext('2d');
const knob = document.getElementById('knob'), stage = document.getElementById('stage');
const divider = document.getElementById('divider'), fpsTag = document.getElementById('fps');
const state = { frame: 0, fx: 'edges', split: 0.5, source: null, video: null, dirty: true, knobs: {} };

const bar = document.getElementById('effects');
for (const [key, e] of Object.entries(EFFECTS)) {
  const b = document.createElement('button');
  b.textContent = e.label; b.dataset.key = key;
  b.onclick = () => selectFx(key);
  bar.appendChild(b);
}

function selectFx(key) {
  state.knobs[state.fx] = knob.value;
  state.fx = key;
  knob.value = state.knobs[key] ?? 50;
  document.getElementById('knobname').textContent = EFFECTS[key].knob;
  document.getElementById('fxname').textContent = EFFECTS[key].label;
  for (const b of bar.children) b.classList.toggle('on', b.dataset.key === key);
  state.dirty = true;
}

function setSize(w, h) {
  const s = Math.min(1, MAX_W / w);
  srcCv.width = fxCv.width = Math.round(w * s);
  srcCv.height = fxCv.height = Math.round(h * s);
}

function useImage(img) {
  stopCam();
  state.source = img;
  setSize(img.naturalWidth, img.naturalHeight);
  sctx.drawImage(img, 0, 0, srcCv.width, srcCv.height);
  state.frame++;
  state.dirty = true;
}

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const img = new Image();
  img.onload = () => { useImage(img); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(file);
}

async function startCam() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    const v = document.createElement('video');
    v.srcObject = stream; v.muted = true; v.playsInline = true;
    await v.play();
    state.video = v;
    setSize(v.videoWidth, v.videoHeight);
    document.getElementById('cam').classList.add('on');
  } catch (err) {
    alert('Could not open the webcam: ' + err.message);
  }
}

function stopCam() {
  if (!state.video) return;
  state.video.srcObject.getTracks().forEach(t => t.stop());
  state.video = null;
  document.getElementById('cam').classList.remove('on');
}

document.getElementById('cam').onclick = () => {
  if (state.video) { stopCam(); if (state.source) useImage(state.source); }
  else startCam();
};
document.getElementById('file').onchange = e => loadFile(e.target.files[0]);
knob.oninput = () => { state.dirty = true; };
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

// Split divider: drag anywhere on the image.
function setSplit(clientX) {
  const r = stage.getBoundingClientRect();
  state.split = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  fxCv.style.clipPath = `inset(0 0 0 ${state.split * 100}%)`;
  divider.style.left = state.split * 100 + '%';
}
let dragging = false;
stage.addEventListener('pointerdown', e => { dragging = true; stage.setPointerCapture(e.pointerId); setSplit(e.clientX); });
stage.addEventListener('pointermove', e => { if (dragging) setSplit(e.clientX); });
stage.addEventListener('pointerup', () => { dragging = false; });

let last = performance.now(), frames = 0;
function render() {
  const w = srcCv.width, h = srcCv.height;
  if (state.video) { sctx.drawImage(state.video, 0, 0, w, h); state.frame++; state.dirty = true; }
  if (state.dirty && w) {
    state.dirty = false;
    const src = sctx.getImageData(0, 0, w, h);
    const out = fctx.createImageData(w, h);
    const res = EFFECTS[state.fx].run(src.data, out.data, w, h, knob.value / 100,
                                      { frame: state.frame, live: !!state.video });
    fctx.putImageData(out, 0, 0);
    const fxname = document.getElementById('fxname');
    fxname.textContent = res?.label ?? EFFECTS[state.fx].label;
    if (res?.more) state.dirty = true;
    const pts = Array.isArray(res) ? res : null;
    if (pts) {
      fctx.fillStyle = '#ffd400'; fctx.strokeStyle = '#000'; fctx.lineWidth = 1.5;
      for (const [x, y] of pts) { fctx.beginPath(); fctx.arc(x, y, 4, 0, 7); fctx.fill(); fctx.stroke(); }
    }
    frames++;
  }
  const now = performance.now();
  if (now - last > 500) {
    fpsTag.textContent = state.video ? Math.round(frames * 1000 / (now - last)) + ' fps' : '';
    frames = 0; last = now;
  }
  requestAnimationFrame(render);
}

setSplit(stage.getBoundingClientRect().left + stage.getBoundingClientRect().width / 2);
selectFx(EFFECTS[location.hash.slice(1)] ? location.hash.slice(1) : 'edges');
const img = new Image();
img.onload = () => useImage(img);
img.src = 'toyon.jpg';
requestAnimationFrame(render);
</script>
</body>
</html>
